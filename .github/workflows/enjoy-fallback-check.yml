name: Inspect official video links for keirin-lineup2
on:
  push:
    branches: [keirin-lineup2-enjoy]
    paths: [.github/workflows/enjoy-fallback-check.yml, keirin-lineup2/**]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Read public official media metadata without login
        working-directory: keirin-lineup2
        run: |
          python3 - <<'PY'
          import sys,re,json
          from urllib.parse import urljoin
          sys.path.insert(0,'scripts')
          from source_http import fetch,state_payloads
          sources=[]
          urls=['https://www.winticket.jp/keirin/kumamoto/live',
                'https://www.winticket.jp/keirin/kumamoto/raceresult/2026102287/1/1',
                'https://www.winticket.jp/keirin/kumamoto/racecard/2026102287/1/12']
          scripts=set()
          for url in urls:
              doc,observed=fetch(url,sources)
              print('PUBLIC PAGE',url,observed)
              for node in doc.find_all('script'):
                  src=node.attrs.get('src','')
                  if src: print('ASSET',src)
                  if src and any(w in src.lower() for w in ('live','video','result','racecard','bootstrap','layouts-keirin')): scripts.add(urljoin(url,src))
                  text=node.text()
                  for match in re.finditer(r'window\.__CONFIG__\s*=\s*',text):
                      config=json.JSONDecoder().raw_decode(text[match.end():])[0]
                      print('PUBLIC VIDEO CONFIG',{k:v for k,v in config.items() if 'VIDEO' in k or 'LIVE' in k})
              for state in state_payloads(doc):
                  if not isinstance(state,dict): continue
                  for q in state.get('tanStackQuery',{}).get('queries',[]):
                      key=q.get('queryKey'); data=q.get('state',{}).get('data',{})
                      print('QUERY',key)
                      if not isinstance(data,dict): continue
                      if 'race' in data:
                          r=data['race']
                          print('RACE VIDEO',{k:v for k,v in r.items() if 'video' in k.lower() or k in ('id','number','status')})
                          print('PREDICTION MARKS',[(r.get('playerId'),r.get('predictionMark')) for r in data.get('records',[])])
                          print('PREDICTION ORDER',[{k:v for k,v in p.items() if k in ('isAi','order','name')} for p in data.get('predictions',[])])
                      if any(w in str(key).lower() for w in ('live','video','stream')):
                          def media(data):
                              if isinstance(data,dict): return {k:media(v) for k,v in data.items() if not any(w in k.lower() for w in ('token','secret','password','key','email'))}
                              if isinstance(data,list): return [media(v) for v in data[:20]]
                              return data
                          print('PUBLIC VIDEO DATA',json.dumps(media(data),ensure_ascii=False)[:10000])
              for node in doc.find_all():
                  if node.tag in ('video','iframe','source'): print('MEDIA ELEMENT',node.tag,node.attrs)
          for src in sorted(scripts)[:15]:
              try:
                  doc,_=fetch(src,sources)
                  text=sources[-1]['raw_html']
                  print('PUBLIC SCRIPT',src,'bytes',len(text))
                  matches=list(re.finditer(r'VIDEO_BASE_URL|digestVideoProvider|digestVideo|liveStream|\.m3u8|\.mp4|predictionMark|iframe|embed',text))
                  for match in matches[:24]:
                      print('MEDIA CODE',text[max(0,match.start()-180):match.end()+240])
              except Exception as error: print('PUBLIC SCRIPT FAILURE',src,type(error).__name__)
          with open('/tmp/lineup2-media.json','w') as f:
              json.dump({'target_date':'2026-10-22','provider':'winticket-media-inspection','sources':sources},f,ensure_ascii=False)
          PY
      - name: Append private source inspection and verify readback
        working-directory: keirin-lineup2
        env:
          SNAPSHOT_SUPABASE_URL: https://ritinxywblgsccjvqoeh.supabase.co
          SNAPSHOT_SUPABASE_SERVICE_KEY: ${{ secrets.SNAPSHOT_SUPABASE_SERVICE_KEY }}
        run: python3 scripts/archive_snapshot.py --date 2026-10-22 --input /tmp/lineup2-media.json --report /tmp/lineup2-media-usage.json
