name: Check isolated Enjoy fallback
on:
  push:
    branches: [keirin-lineup2-enjoy]
    paths: [.github/workflows/enjoy-fallback-check.yml, keirin-lineup2/**]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Inspect saved source structure without collecting again
        env:
          SNAPSHOT_SUPABASE_URL: https://ritinxywblgsccjvqoeh.supabase.co
          SNAPSHOT_SUPABASE_SERVICE_KEY: ${{ secrets.SNAPSHOT_SUPABASE_SERVICE_KEY }}
        run: |
          python3 - <<'PY'
          import sys, json, re, os
          sys.path.insert(0,'scripts')
          from archive_snapshot import Storage, BUCKET
          from collect_exacta import Document, Node
          store=Storage(os.environ['SNAPSHOT_SUPABASE_URL'],os.environ['SNAPSHOT_SUPABASE_SERVICE_KEY'])
          saved=None
          for item in reversed(store.list_all('2026-10-22')):
              if not item.get('id'): continue
              candidate=store.request('GET','object/authenticated/'+BUCKET+'/2026-10-22/'+item['name'])
              if candidate.get('provider')=='alternate-source-probe':
                  saved=candidate
                  break
          assert saved
          def shape(v,depth=0):
              if depth>5: return type(v).__name__
              if isinstance(v,dict): return {str(k):shape(value,depth+1) for k,value in list(v.items())[:32]}
              if isinstance(v,list): return {'length':len(v),'item':shape(v[0],depth+1) if v else None}
              return type(v).__name__
          for source in saved['sources']:
              doc=Document(source['raw_html']).root
              payload=None
              for script in doc.find_all('script'):
                  match=re.search(r'window\.__PRELOADED_STATE__\s*=\s*',script.text())
                  if match:
                      payload=json.JSONDecoder().raw_decode(script.text()[match.end():])[0]
                      break
              if payload is None: continue
              print(json.dumps({'source':source['url'],'observed_at':source['observed_at']},ensure_ascii=False))
              print(json.dumps({'keirin_common':shape(payload['redux']['keirin']['races']['common'])},ensure_ascii=False))
              print(json.dumps({'keirin_odds':shape(payload['redux']['keirin']['races']['odds'])},ensure_ascii=False))
              for q in payload.get('tanStackQuery',{}).get('queries',[]):
                  print(json.dumps({'query_key':q['queryKey'],'data_shape':shape(q['state'].get('data'))},ensure_ascii=False))
              for node in doc.find_all():
                  if node.text().strip()=='並び予想':
                      parent=node
                      for i in range(2):
                          if parent.parent: parent=parent.parent
                      def tags(n,depth=0):
                          if depth>3: return None
                          return {'tag':n.tag,'attrs':n.attrs,'children':[tags(c,depth+1) for c in n.children if isinstance(c,Node)][:15]}
                      print(json.dumps({'lineup_markup':tags(parent)},ensure_ascii=False))
                      break
          PY
