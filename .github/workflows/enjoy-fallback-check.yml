name: Inspect WINTICKET current-meeting results
on:
  push:
    branches: [keirin-lineup2-enjoy]
    paths: [.github/workflows/enjoy-fallback-check.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Inspect public current-meeting result fields
        working-directory: keirin-lineup2
        run: |
          python3 - <<'PY'
          import sys,json,re,gzip
          from urllib.request import Request,urlopen
          sys.path.insert(0,'scripts')
          from source_http import fetch,state_payloads
          sources=[]
          for url in ('https://www.winticket.jp/keirin/odawara/racecard/2026102036/3/6','https://www.winticket.jp/keirin/yokkaichi/racecard/2026102148/2/6'):
              doc,observed=fetch(url,sources)
              print('PAGE',url,observed)
              for state in state_payloads(doc):
                  if not isinstance(state,dict): continue
                  for q in state.get('tanStackQuery',{}).get('queries',[]):
                      key=q.get('queryKey',[]);data=q.get('state',{}).get('data',{})
                      print('PUBLIC QUERY',key,'FIELDS',list(data) if isinstance(data,dict) else type(data).__name__)
                      if len(key)>1 and key[1]=='FETCH_KEIRIN_RACE':
                          print('PUBLIC RECORD',json.dumps(data.get('records',[{}])[0],ensure_ascii=False)[:14000])
                          for k,v in data.items():
                              if any(w in k.lower() for w in ('recent','past','history','result')): print('PUBLIC RESULT FIELD',k,json.dumps(v,ensure_ascii=False)[:14000])
              for node in doc.find_all('a'):
                  if any(w in node.text() for w in ('直近','今場所')): print('RECENT LINK',node.attrs,node.text())
          url='https://www.winticket.jp/assets/a53660/chunk.ba7d3223a3c683fa.min.js'
          with urlopen(Request(url,headers={'Accept-Encoding':'identity'}),timeout=40) as response:
              raw=response.read(3000000)
              if raw[:2]==b'\x1f\x8b':raw=gzip.decompress(raw)
              code=raw.decode()
          snippets=[]
          for m in list(re.finditer(r'今場所|RECENT|recentResults|recentRecords|recentResult|上がり|上り',code))[:35]:
              snippet=code[max(0,m.start()-400):m.end()+700]
              snippets.append(snippet);print('PUBLIC RECENT CODE',snippet)
          sources.append({'url':url,'observed_at':sources[-1]['observed_at'],'snippets':snippets})
          with open('/tmp/lineup2-history-probe.json','w') as f:
              json.dump({'target_date':'2026-10-22','provider':'winticket-meeting-history-inspection','sources':sources},f,ensure_ascii=False)
          PY
      - name: Append private source inspection and verify it
        working-directory: keirin-lineup2
        env:
          SNAPSHOT_SUPABASE_URL: https://ritinxywblgsccjvqoeh.supabase.co
          SNAPSHOT_SUPABASE_SERVICE_KEY: ${{ secrets.SNAPSHOT_SUPABASE_SERVICE_KEY }}
        run: python3 scripts/archive_snapshot.py --date 2026-10-22 --input /tmp/lineup2-history-probe.json --report /tmp/lineup2-history-probe-usage.json
