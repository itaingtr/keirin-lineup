name: Prepare October 21 independent card only
on:
  push:
    branches: [keirin-lineup2-enjoy]
    paths: [.github/workflows/enjoy-fallback-check.yml, keirin-lineup2/scripts/prepare_oct21.py]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: keirin-lineup2-preview
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Test source identity validation
        working-directory: keirin-lineup2
        run: python3 -m unittest discover -s tests -v
      - name: Independently collect October 21, append privately and read back before rendering
        working-directory: keirin-lineup2
        env:
          SNAPSHOT_SUPABASE_URL: https://ritinxywblgsccjvqoeh.supabase.co
          SNAPSHOT_SUPABASE_SERVICE_KEY: ${{ secrets.SNAPSHOT_SUPABASE_SERVICE_KEY }}
        run: python3 -u scripts/prepare_oct21.py
      - name: Append new October 21 display artifact
        run: |
          DEST="keirin-lineup2-oct21/run-${{ github.run_id }}-${{ github.run_attempt }}"
          test ! -e "$DEST"
          mkdir -p "$DEST"
          cp -R /tmp/lineup2-oct21/line20261021.html "$DEST/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$DEST"
          git commit -m 'Append verified October 21 independent display card'
          git push origin HEAD:keirin-lineup2-enjoy
