name: Check isolated Enjoy fallback
on:
  push:
    branches: [keirin-lineup2-enjoy]
    paths: [.github/workflows/enjoy-fallback-check.yml, keirin-lineup2/**]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Inspect public source structure and preserve it privately
        env:
          SNAPSHOT_SUPABASE_URL: https://ritinxywblgsccjvqoeh.supabase.co
          SNAPSHOT_SUPABASE_SERVICE_KEY: ${{ secrets.SNAPSHOT_SUPABASE_SERVICE_KEY }}
        run: |
          python3 - <<'PY'
          import sys, json, re, urllib.request, urllib.error, http.cookiejar, os, time
          from datetime import datetime, timezone
          sys.path.insert(0,'scripts')
          from collect_exacta import Document, Node
          from archive_snapshot import Storage, BUCKET, snapshot_name
          urls = [
            'https://www.winticket.jp/keirin/kumamoto/racecard/2026102287/1/12',
            'https://www.winticket.jp/keirin/kumamoto/odds/2026102287/1/12',
            'https://www.winticket.jp/keirin/racecard/20261022',
          ]
          opener=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))
          store = Storage(os.environ['SNAPSHOT_SUPABASE_URL'], os.environ['SNAPSHOT_SUPABASE_SERVICE_KEY'])
          bucket = store.request('GET','bucket/'+BUCKET)
          assert bucket.get('public') is False, 'Expected existing private bucket'
          sources=[]
          for url in urls:
              req=urllib.request.Request(url,headers={'User-Agent':'KeirinLineup2/1.0 (+https://github.com/itaingtr/keirin-lineup)'})
              try:
                  with opener.open(req, timeout=45) as response:
                      raw=response.read(6000001)
                      if len(raw)>6000000: raise ValueError('Response too large')
                      body=raw.decode('utf-8')
              except urllib.error.HTTPError as error:
                  print(json.dumps({'source':url,'http_status':error.code,'reason':error.reason}))
                  time.sleep(2)
                  continue
              sources.append({'url':url,'observed_at':datetime.now(timezone.utc).isoformat(),'raw_html':body})
              doc=Document(body).root
              tables=list(doc.find_all('table'))
              print(json.dumps({'source':url,'bytes':len(raw),'tables':len(tables)},ensure_ascii=False))
              for table in tables:
                  rows=list(table.find_all('tr'))
                  summaries=[]
                  for row in rows:
                      cells=[n for n in row.children if isinstance(n,Node) and n.tag in ('th','td')]
                      labels=[re.sub(r'\s+',' ',n.text()).strip()[:90] for n in cells if n.tag=='th']
                      summaries.append({'cells':len(cells),'labels':labels,'attrs':row.attrs})
                  print(json.dumps({'table':table.attrs,'rows':summaries[:12]},ensure_ascii=False))
              for script in doc.find_all('script'):
                  if script.attrs.get('src'): continue
                  text=script.text().strip()
                  print(json.dumps({'inline_script':script.attrs,'characters':len(text),'prefix_tokens':re.sub(r'\w{20,}', 'LONG_TOKEN',text[:100]),'assignments':re.findall(r'(?:window\.)?([A-Za-z_$][A-Za-z_$0-9.]*)\s*=',text)[:15]},ensure_ascii=False))
                  for match in re.finditer(r'(?:window\.)?([A-Z_][A-Z_0-9]+)\s*=\s*',text):
                      try: payload=json.JSONDecoder().raw_decode(text[match.end():])[0]
                      except ValueError: continue
                      def shape(value,depth=0):
                          if depth>3: return type(value).__name__
                          if isinstance(value,dict): return {str(k):shape(v,depth+1) for k,v in list(value.items())[:45]}
                          if isinstance(value,list): return {'length':len(value),'item':shape(value[0],depth+1) if value else None}
                          return type(value).__name__
                      print(json.dumps({'state_variable':match[1],'shape':shape(payload)},ensure_ascii=False))
              print(json.dumps({'scripts':[n.attrs.get('src') for n in doc.find_all('script') if n.attrs.get('src')]},ensure_ascii=False))
              for node in doc.find_all():
                  attrs=json.dumps(node.attrs,ensure_ascii=False)
                  if re.search('odds|formation|lineup|line-up|race-player|race-member|race_member|race-program|race-detail|Formation|Lineup|Forecast|Prediction',attrs,re.I):
                      print(json.dumps({'tag':node.tag,'attrs':node.attrs,'children':[{'tag':c.tag,'attrs':c.attrs} for c in node.children if isinstance(c,Node)][:12]},ensure_ascii=False))
          if not sources: raise SystemExit('No alternate source was readable; existing pages preserved')
          data=json.dumps({'target_date':'2026-10-22','provider':'alternate-source-probe','purpose':'isolated source verification','sources':sources},ensure_ascii=False).encode()
          name=snapshot_name('2026-10-22')
          store.upload(name,data)
          store.verify(name,data)
          print('Private append and readback passed.')
          print(json.dumps(store.usage(),ensure_ascii=False))
          PY
