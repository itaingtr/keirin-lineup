name: Validate independent keirin-lineup2
on:
  push:
    branches: [keirin-lineup2-enjoy]
    paths: [.github/workflows/enjoy-fallback-check.yml, keirin-lineup2/**]
  workflow_dispatch:
    inputs:
      date:
        description: Race date YYYY-MM-DD (blank = today in Japan)
        required: false
permissions:
  contents: write
concurrency:
  group: keirin-lineup2-preview
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Test independent validation and renderer
        working-directory: keirin-lineup2
        run: python3 -m unittest discover -s tests -v
      - name: Select the requested race day
        env:
          REQUESTED_DATE: ${{ inputs.date }}
        run: |
          python3 - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          target=os.environ.get('REQUESTED_DATE') or datetime.now(ZoneInfo('Asia/Tokyo')).date().isoformat()
          datetime.strptime(target,'%Y-%m-%d')
          with open(os.environ['GITHUB_ENV'],'a') as handle: handle.write('TARGET_DATE='+target+'\n')
          PY
      - name: Collect independently and verify all ordered exacta pairs
        working-directory: keirin-lineup2
        run: |
          python3 scripts/collect_sources.py --date "$TARGET_DATE" --snapshot /tmp/lineup2-card.json --feed /tmp/lineup2-feed.json
      - name: Append verified source data privately and read it back
        working-directory: keirin-lineup2
        env:
          SNAPSHOT_SUPABASE_URL: https://ritinxywblgsccjvqoeh.supabase.co
          SNAPSHOT_SUPABASE_SERVICE_KEY: ${{ secrets.SNAPSHOT_SUPABASE_SERVICE_KEY }}
        run: |
          python3 scripts/archive_snapshot.py --date "$TARGET_DATE" --input /tmp/lineup2-card.json --report /tmp/lineup2-usage.json
      - name: Generate a new isolated display artifact
        run: |
          python3 keirin-lineup2/scripts/render_races.py /tmp/lineup2-card.json --site-dir /tmp/lineup2-site
          cp keirin-lineup2/site/*.js keirin-lineup2/site/*.css /tmp/lineup2-site/
          cp keirin-lineup2/site/odds-config.json /tmp/lineup2-site/
          cp /tmp/lineup2-feed.json /tmp/lineup2-site/odds.json
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          card=json.loads(Path('/tmp/lineup2-card.json').read_text())
          feed=json.loads(Path('/tmp/lineup2-feed.json').read_text())
          usage=json.loads(Path('/tmp/lineup2-usage.json').read_text())
          pairs=sum(len(r['snapshot'].get('odds',[])) for r in feed['results'])
          print(f"PASS {len(card['races'])} S-class races, {sum(len(r['players']) for r in card['races'])} riders, {pairs} independent exacta pairs")
          print(f"Private source storage: {usage['known_bytes']} bytes total, {usage['objects']} snapshots")
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as handle:
              handle.write(f"Independent WINTICKET preview: {len(card['races'])} races, {pairs} exacta pairs. Original site and historical pages unchanged. Private source archive: {usage['known_bytes']} bytes total.\n")
          PY
      - name: Save only new display files on the experimental branch
        run: |
          DEST="keirin-lineup2-previews/run-${{ github.run_id }}-${{ github.run_attempt }}"
          test ! -e "$DEST"
          mkdir -p "$DEST"
          cp -R /tmp/lineup2-site/. "$DEST/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$DEST"
          git commit -m 'Save independently validated keirin-lineup2 preview'
          git push origin HEAD:keirin-lineup2-enjoy
