name: Verify official public broadcast URLs
on:
  push:
    branches: [keirin-lineup2-enjoy]
    paths: [.github/workflows/enjoy-fallback-check.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Inspect saved public broadcast metadata
        working-directory: keirin-lineup2
        env:
          SNAPSHOT_SUPABASE_URL: https://ritinxywblgsccjvqoeh.supabase.co
          SNAPSHOT_SUPABASE_SERVICE_KEY: ${{ secrets.SNAPSHOT_SUPABASE_SERVICE_KEY }}
        run: |
          python3 - <<'PY'
          import sys,os,json
          sys.path.insert(0,'scripts')
          from source_http import Document,state_payloads
          from archive_snapshot import Storage
          from urllib.parse import urlsplit,urlunsplit
          store=Storage(os.environ['SNAPSHOT_SUPABASE_URL'],os.environ['SNAPSHOT_SUPABASE_SERVICE_KEY'])
          for item in reversed(store.list_all('2026-10-22')):
              saved=store.request('GET','object/authenticated/keirin-source-snapshots/2026-10-22/'+item['name'])
              if saved.get('provider')=='winticket-media-inspection': break
          else: raise ValueError('Saved media source missing')
          def clean(v):
              if isinstance(v,dict): return {k:clean(x) for k,x in v.items() if not any(s in k.lower() for s in ('token','secret','password'))}
              if isinstance(v,list): return [clean(x) for x in v]
              if isinstance(v,str) and v.startswith('https://'):
                  p=urlsplit(v)
                  return urlunsplit((p.scheme,p.netloc,p.path,'[query omitted]' if p.query else '',p.fragment))
              return v
          source=next(s for s in saved['sources'] if s['url'].endswith('/live'))
          for state in state_payloads(Document(source['raw_html']).root):
              if not isinstance(state,dict): continue
              for q in state.get('tanStackQuery',{}).get('queries',[]):
                  key=q.get('queryKey',[]); data=q.get('state',{}).get('data',{})
                  if len(key)>1 and key[1]=='FETCH_BROADCAST_TIMETABLE':
                      for c in data['channels']:
                          if c.get('venueId') in ('36','48','87'): print('VERIFIED BROADCAST',json.dumps(clean(c),ensure_ascii=False))
                  if len(key)>1 and key[1]=='FETCH_KEIRIN_VENUE_INFO': print('VERIFIED VENUE',json.dumps(clean(data['venue']),ensure_ascii=False))
          PY
