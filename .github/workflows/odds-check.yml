name: Collect exacta odds
on:
  workflow_dispatch:
  schedule:
    # GitHub uses UTC: 02:00–08:00 UTC = 11:00–17:00 JST, every day.
    - cron: '0 2-8 * * *'
  push:
    branches: [main]
    paths:
      - .github/workflows/odds-check.yml
      - scripts/collect_exacta.py
permissions:
  contents: write
concurrency:
  group: exacta-diagnostic
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Test parser
        run: python3 -m unittest discover -s tests -v
      - name: Read exacta odds for the current published card
        run: |
          python3 scripts/collect_exacta.py \
            --page site/index.html \
            --report /tmp/exacta-report.json
      - name: Preserve diagnostic result on a separate branch
        env:
          REPORT_NAME: run-${{ github.run_id }}-${{ github.run_attempt }}.json
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin odds-diagnostics > /dev/null; then
            git fetch origin odds-diagnostics
            git checkout -b odds-diagnostics FETCH_HEAD
          else
            git checkout -b odds-diagnostics
          fi
          mkdir -p diagnostics/exacta
          cp /tmp/exacta-report.json "diagnostics/exacta/$REPORT_NAME"
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          current=json.loads(Path('/tmp/exacta-report.json').read_text())
          latest=Path('diagnostics/exacta/latest.json')
          previous=json.loads(latest.read_text()) if latest.exists() else {'results':[]}
          snapshots={item['snapshot']['race_key']:item for item in previous['results'] if item.get('ok')}
          for item in current['results']:
              if item.get('ok'):
                  snapshots[item['snapshot']['race_key']]=item
          latest.write_text(json.dumps({'checked_at':current['checked_at'],'results':list(snapshots.values())},ensure_ascii=False,indent=2)+'\n')
          PYTHON
          git add "diagnostics/exacta/$REPORT_NAME" diagnostics/exacta/latest.json
          git commit -m 'Save exacta odds snapshots'
          git push origin HEAD:odds-diagnostics
